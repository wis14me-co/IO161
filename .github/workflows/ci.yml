name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Run backend tests
        run: |
          python -m pytest tests/ -v --tb=short

  frontend-lint:
    name: Frontend Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check Prettier formatting
        run: npm run format:check

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run frontend tests
        run: npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t pocketful:test .
      
      - name: Check image size
        run: |
          SIZE=$(docker images pocketful:test --format "{{.Size}}" | head -1)
          echo "Image size: $SIZE"
          # Convert to MB for comparison (rough check)
          # Fail if over 2GB (this is a rough check)
          if [[ "$SIZE" == *"GB"* ]]; then
            echo "Warning: Image is over 1GB"
          fi

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Start container
        run: |
          docker run -d --name pocketful-test -p 8080:8080 pocketful:test
          # Wait for startup
          sleep 10
          # Health check
          for i in {1..30}; do
            if curl -f http://localhost:8080/health; then
              echo "Container is healthy"
              break
            fi
            sleep 2
          done
      
      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short
      
      - name: Cleanup
        if: always()
        run: docker rm -f pocketful-test || true