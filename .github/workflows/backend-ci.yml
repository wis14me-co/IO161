name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Run tests
        run: python -m pytest tests/ -v
      
      - name: Run type checking (if mypy is available)
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports || true

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t pocketful:test .
      
      - name: Test Docker image starts
        run: |
          docker run -d --name pocketful-test -p 8080:8080 pocketful:test
          sleep 10
          curl -f http://localhost:8080/health || (docker logs pocketful-test && exit 1)
          docker stop pocketful-test
          docker rm pocketful-test