<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Pocketful{% endblock %}</title>

    <!-- Design System - CSS Custom Properties -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/design-system.min.css') }}" />

    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token }}" />
  </head>
  <body>
    <div class="container">{% block content %}{% endblock %}</div>
    {% block scripts %}
    <script src="{{ url_for('static', path='js/api.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/app.min.js') }}"></script>
    {% endblock %}
  </body>
</html>
