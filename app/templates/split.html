{% extends "base.html" %} {% block title %}Pocketful - Split{% endblock %} {% block content %}
<h1>Pocketful - Split</h1>

<div class="container">
  <div class="card">
    <h3>Split Bill</h3>

    <div class="form-group">
      <label class="form-label" for="split-amount">Total Amount</label>
      <input
        type="text"
        id="split-amount"
        class="input"
        placeholder="30.00"
        inputmode="decimal"
        aria-describedby="split-amount-help"
        data-testid="split-amount"
      />
      <div
        id="split-amount-help"
        class="form-text"
        style="display: none; color: var(--text-secondary)"
      >
        Enter total amount in EUR
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="split-handles">Participant Handles</label>
      <input
        type="text"
        id="split-handles"
        class="input"
        placeholder="ada,bob,cy (comma-separated)"
        aria-describedby="split-handles-help"
        data-testid="split-handles"
      />
      <div
        id="split-handles-help"
        class="form-text"
        style="display: none; color: var(--text-secondary)"
      >
        Enter comma-separated participant handles
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="split-note">Note</label>
      <input
        type="text"
        id="split-note"
        class="input"
        placeholder="dinner"
        aria-describedby="split-note-help"
        data-testid="split-note"
      />
      <div
        id="split-note-help"
        class="form-text"
        style="display: none; color: var(--text-secondary)"
      >
        Optional note for the split
      </div>
    </div>

    <button id="split-submit" class="btn" aria-label="Create split" data-testid="split-submit">Create Split</button>
    <div
      id="split-error"
      class="form-text"
      style="display: none; color: var(--negative)"
      role="alert"
      aria-live="polite"
      data-testid="split-error"
    ></div>
  </div>

  <div class="card" style="margin-top: var(--space-lg)">
    <h3>Share Preview</h3>
    <div id="split-preview" style="display: none" data-testid="split-preview"></div>
    <div class="empty-splits" style="display: none; color: var(--text-secondary)" data-testid="empty-splits">
      No shares to display
    </div>
  </div>
</div>
{% endblock %}
