{% extends "base.html" %} {% block title %}Pocketful - Requests{% endblock %} {% block content %}
<h1>Pocketful - Requests</h1>

<div class="container">
  <div class="row">
    <div class="col">
      <div class="card">
        <h3>Incoming Requests</h3>
        <div class="empty-requests" id="incoming-list-empty" role="status" aria-live="polite" data-testid="empty-requests">
          No incoming requests
        </div>
        <div
          id="incoming-list"
          style="max-height: 400px; overflow-y: auto"
          aria-label="Incoming requests"
          data-testid="incoming-list"
        >
          <!-- Incoming requests inserted by JavaScript -->
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <h3>Outgoing Requests</h3>
        <div class="empty-requests" id="outgoing-list-empty" role="status" aria-live="polite" data-testid="empty-requests">
          No outgoing requests
        </div>
        <div
          id="outgoing-list"
          style="max-height: 400px; overflow-y: auto"
          aria-label="Outgoing requests"
          data-testid="outgoing-list"
        >
          <!-- Outgoing requests inserted by JavaScript -->
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
