openapi: 3.0.3
info:
  title: Pocketful
  description: |
    Pocketful is a payment and settlement service that allows users to send money by handle,
    request money, and split bills. Payments appear in an activity feed with public or private
    visibility. Authorized operators can submit groups of transfers as settlements.
  version: 1.0.0
  contact:
    name: Pocketful API
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.pocketful.example
    description: Production server

tags:
  - name: Health
    description: Health check endpoint
  - name: Authentication
    description: User authentication (signup, login)
  - name: User
    description: Current user information
  - name: Payments
    description: Create and manage payments
  - name: Requests
    description: Create and manage money requests
  - name: Activity
    description: Activity feed
  - name: Splits
    description: Split bills among participants
  - name: Settlements
    description: Atomic net settlements
  - name: Test
    description: Test and fixture utilities

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: |
        Returns 200 once the service and its data store can serve requests, within 60 seconds
        of container start. Non-200 responses are permitted before the service is ready.
      operationId: health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok

  /auth/signup:
    post:
      tags: [Authentication]
      summary: User signup
      description: |
        Creates a new user account. Email is used as the unique identifier. Password must be
        at least 8 characters. Handle is derived from email (local part, lowercase, replace
        non-alphanumeric with underscore, truncate to 20 characters). If derived handle is
        already taken, signup fails.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: ada@example.com
              password: correct horse
              display_name: Ada
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                user_id: u_1
                display_name: Ada
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '409':
          description: Email already registered or handle already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: email_taken
                  message: Email already registered
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: validation_failed
                  message: Password must be at least 8 characters

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: |
        Authenticates a user with email and password. Returns a bearer token that can be used
        for subsequent requests.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ada@example.com
              password: correct horse
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                user_id: u_1
                display_name: Ada
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Wrong password or unknown email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthenticated
                  message: Wrong password or unknown email

  /me:
    get:
      tags: [User]
      summary: Get current user
      description: |
        Returns information about the currently authenticated user including balance and
        currency configuration.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                user_id: u_1
                display_name: Ada
                handle: ada
                balance: 10000
                currency: EUR
                minor_units: 2
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthenticated
                  message: Missing or invalid token
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: User not found

  /payments:
    post:
      tags: [Payments]
      summary: Create payment
      description: |
        **An idempotent write path.** Creates a payment from the authenticated user to another
        user. The transfer is atomic: money is debited from sender and credited to recipient
        together. If the sender's balance is insufficient, the payment fails with 409.
      operationId: createPayment
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique identifier for idempotency. Must be 1-255 characters. The key is scoped
            to the authenticated user. Same key with same body on different paths is not
            a replay and succeeds normally.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[a-zA-Z0-9_\-\.]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              to_handle: bob
              amount: 1500
              note: dinner
              visibility: public
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              example:
                payment_id: p_7
                from_user_id: u_1
                from_handle: ada
                to_user_id: u_2
                to_handle: bob
                amount: 1500
                currency: EUR
                note: dinner
                visibility: public
                request_id: null
                created_at: '2026-09-24T11:04:03+00:00'
        '200':
          description: Idempotent replay - same key and body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: missing_idempotency_key
                  message: Idempotency-Key header is required
        '409':
          description: Insufficient funds or idempotency key reuse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficient_funds:
                  summary: Insufficient funds
                  value:
                    error:
                      code: insufficient_funds
                      message: Insufficient funds
                idempotency_key_reuse:
                  summary: Idempotency key reuse with different body
                  value:
                    error:
                      code: idempotency_key_reuse
                      message: Idempotency key already used with different request body
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                self_payment:
                  summary: Cannot send payment to yourself
                  value:
                    error:
                      code: self_payment
                      message: Cannot send payment to yourself
                invalid_amount:
                  summary: Invalid amount
                  value:
                    error:
                      code: validation_failed
                      message: amount must be integer 1..1000000000
                invalid_visibility:
                  summary: Invalid visibility
                  value:
                    error:
                      code: validation_failed
                      message: visibility must be public or private
        '404':
          description: Recipient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: Recipient not found

  /requests:
    post:
      tags: [Requests]
      summary: Create money request
      description: |
        **An idempotent write path.** Creates a request for the authenticated user to ask
        another user for money. The requester will receive; the payer is being asked.
        The payer's balance is **not checked** at creation time - a request can exceed the
        payer's balance and will remain pending until paid, declined, or cancelled.
      operationId: createRequest
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique identifier for idempotency. Must be 1-255 characters. The key is scoped
            to the authenticated user.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreate'
            example:
              payer_handle: ada
              amount: 1200
              note: taxi
      responses:
        '201':
          description: Request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
              example:
                request_id: rq_4
                requester_id: u_2
                requester_handle: bob
                payer_id: u_1
                payer_handle: ada
                amount: 1200
                currency: EUR
                note: taxi
                status: pending
                payment_id: null
                created_at: '2026-09-24T11:06:10+00:00'
        '200':
          description: Idempotent replay - same key and body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          description: Missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: missing_idempotency_key
                  message: Idempotency-Key header is required
        '409':
          description: Idempotency key reuse with different body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: idempotency_key_reuse
                  message: Idempotency key already used with different request body
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                self_request:
                  summary: Cannot request from yourself
                  value:
                    error:
                      code: self_request
                      message: Cannot request from yourself
                invalid_amount:
                  summary: Invalid amount
                  value:
                    error:
                      code: validation_failed
                      message: amount must be integer 1..1000000000
        '404':
          description: Payer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: Payer not found

  /requests/{request_id}/pay:
    post:
      tags: [Requests]
      summary: Pay a request
      description: |
        **An idempotent write path.** Only the payer may call this endpoint. Pays the
        outstanding request and creates a payment. The request becomes `paid` and carries
        the new `payment_id`. A replay returns 200 with the original payment body, even
        when the request is already `paid`.
      operationId: payRequest
      security:
        - BearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          description: ID of the request to pay
          schema:
            type: string
          example: rq_4
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique identifier for idempotency. Must be 1-255 characters. The key is scoped
            to the authenticated user. **Replays must send the identical body** — `{}` and
            `{"visibility": "public"}` are different JSON values, so reusing a key across
            the two is `409 idempotency_key_reuse`.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPay'
            example:
              visibility: public
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              example:
                payment_id: p_8
                from_user_id: u_1
                from_handle: ada
                to_user_id: u_2
                to_handle: bob
                amount: 1200
                currency: EUR
                note: taxi
                visibility: public
                request_id: rq_4
                created_at: '2026-09-24T11:08:00+00:00'
        '200':
          description: Idempotent replay - same key and body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: missing_idempotency_key
                  message: Idempotency-Key header is required
        '403':
          description: Not the payer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: forbidden
                  message: Not the payer
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: Request not found
        '409':
          description: Request not pending or insufficient funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_pending:
                  summary: Request is not pending
                  value:
                    error:
                      code: request_not_pending
                      message: Request is not pending
                insufficient_funds:
                  summary: Insufficient funds
                  value:
                    error:
                      code: insufficient_funds
                      message: Insufficient funds

  /requests/{request_id}/decline:
    post:
      tags: [Requests]
      summary: Decline a request
      description: |
        Only the payer may call this endpoint. Declines the outstanding request and returns
        the request with `status: "declined"`. Declining an already-declined request is not
        an error and returns the current state. A `paid` or `cancelled` request is `409`.
      operationId: declineRequest
      security:
        - BearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          description: ID of the request to decline
          schema:
            type: string
          example: rq_4
      responses:
        '200':
          description: Request declined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
              example:
                request_id: rq_4
                requester_id: u_2
                requester_handle: bob
                payer_id: u_1
                payer_handle: ada
                amount: 1200
                currency: EUR
                note: taxi
                status: declined
                payment_id: null
                created_at: '2026-09-24T11:09:00+00:00'
        '403':
          description: Not the payer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: forbidden
                  message: Not the payer
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: Request not found
        '409':
          description: Request is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: request_not_pending
                  message: Request is not pending

  /requests/{request_id}/cancel:
    post:
      tags: [Requests]
      summary: Cancel a request
      description: |
        Only the requester may call this endpoint. Cancels the outstanding request and returns
        the request with `status: "cancelled"`. Cancelling an already-cancelled request is not
        an error and returns the current state. A `paid` or `declined` request is `409`.
      operationId: cancelRequest
      security:
        - BearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          description: ID of the request to cancel
          schema:
            type: string
          example: rq_4
      responses:
        '200':
          description: Request cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
              example:
                request_id: rq_4
                requester_id: u_2
                requester_handle: bob
                payer_id: u_1
                payer_handle: ada
                amount: 1200
                currency: EUR
                note: taxi
                status: cancelled
                payment_id: null
                created_at: '2026-09-24T11:10:00+00:00'
        '403':
          description: Not the requester
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: forbidden
                  message: Not the requester
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: Request not found
        '409':
          description: Request is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: request_not_pending
                  message: Request is not pending

  /requests:
    get:
      tags: [Requests]
      summary: List requests
      description: |
        Returns requests where the caller is the requester or the payer, in newest first
        order by `created_at`. Supports filtering by direction and status.
      operationId: listRequests
      security:
        - BearerAuth: []
      parameters:
        - name: direction
          in: query
          description: |
            Filter by direction: `incoming` (caller is payer), `outgoing` (caller is requester).
            If absent, returns requests where caller is either requester or payer.
          schema:
            type: string
            enum: [incoming, outgoing]
            default: null
          example: incoming
        - name: status
          in: query
          description: |
            Filter by status. If absent, returns requests of all statuses.
          schema:
            type: string
            enum: [pending, paid, declined, cancelled]
            default: null
          example: pending
        - name: limit
          in: query
          description: |
            Number of results to return. Must be integer 1-200.
            Default: 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          example: 50
        - name: offset
          in: query
          description: |
            Number of results to skip. Must be 0 or more.
            Default: 0.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: List of requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestListResponse'
              example:
                requests:
                  - request_id: rq_5
                    requester_id: u_2
                    requester_handle: bob
                    payer_id: u_1
                    payer_handle: ada
                    amount: 1200
                    currency: EUR
                    note: taxi
                    status: pending
                    payment_id: null
                    created_at: '2026-09-24T11:06:10+00:00'
                has_more: false
        '422':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: validation_failed
                  message: limit must be integer 1..200

  /splits:
    post:
      tags: [Splits]
      summary: Split amount among participants
      description: |
        **An idempotent write path.** Splits an amount the caller already paid, and asks
        each of the other participants for their share by creating one `pending` request each.
        Shares follow the equal-split rule: whole minor units, sum exactly to amount, differ
        by at most one minor unit, larger shares go to first participants in order.
        The caller may be included in `participant_handles` or omitted. A split whose only
        participant is the caller is valid: it computes one share, creates zero requests,
        and returns `"requests": []`.
      operationId: createSplit
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique identifier for idempotency. Must be 1-255 characters. The key is scoped
            to the authenticated user.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitRequest'
            example:
              amount: 3000
              participant_handles: [ada, bob, cy]
              note: dinner
      responses:
        '201':
          description: Split created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitResponse'
              example:
                split_id: sp_2
                amount: 3000
                currency: EUR
                note: dinner
                shares:
                  - handle: ada
                    amount: 1000
                  - handle: bob
                    amount: 1000
                  - handle: cy
                    amount: 1000
                requests:
                  - request_id: rq_6
                    requester_id: u_1
                    requester_handle: ada
                    payer_id: u_2
                    payer_handle: bob
                    amount: 1000
                    currency: EUR
                    note: dinner
                    status: pending
                    payment_id: null
                    created_at: '2026-09-24T11:11:00+00:00'
                created_at: '2026-09-24T11:11:00+00:00'
        '200':
          description: Idempotent replay - same key and body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitResponse'
        '400':
          description: Missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: missing_idempotency_key
                  message: Idempotency-Key header is required
        '409':
          description: Idempotency key reuse with different body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: idempotency_key_reuse
                  message: Idempotency key already used with different request body
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_amount:
                  summary: Invalid amount
                  value:
                    error:
                      code: validation_failed
                      message: amount must be integer 1..1000000000
                duplicate_handles:
                  summary: Duplicate handles in participant_handles
                  value:
                    error:
                      code: validation_failed
                      message: Duplicate handles in participant_handles
                invalid_visibility:
                  summary: Invalid visibility
                  value:
                    error:
                      code: validation_failed
                      message: visibility must be public or private
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: User cy not found

  /activity:
    get:
      tags: [Activity]
      summary: Get activity feed
      description: |
        Returns payments visible to the caller by the feed contract. A payment appears if
        its `visibility` is `public`, or the caller is its sender or receiver. Newest first
        by `created_at`.
      operationId: getActivity
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: |
            Number of results to return. Must be integer 1-200.
            Default: 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          example: 50
        - name: offset
          in: query
          description: |
            Number of results to skip. Must be 0 or more.
            Default: 0.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
              example:
                payments:
                  - payment_id: p_7
                    from_user_id: u_1
                    from_handle: ada
                    to_user_id: u_2
                    to_handle: bob
                    amount: 1500
                    currency: EUR
                    note: dinner
                    visibility: public
                    request_id: null
                    created_at: '2026-09-24T11:04:03+00:00'
                has_more: false
        '422':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: validation_failed
                  message: limit must be integer 1..200

  /settlements:
    post:
      tags: [Settlements]
      summary: Create atomic net settlement
      description: |
        **An idempotent write path.** Creates a batch of transfers that commit atomically.
        All transfers must succeed together or none do. A settlement is affordable when every
        wallet's balance after all incoming and outgoing transfers is nonnegative.
        Requires `settlement_operator_ids` permission.
      operationId: createSettlement
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique identifier for idempotency. Must be 1-255 characters. The key is scoped
            to the authenticated user.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementRequest'
            example:
              transfers:
                - from_handle: ada
                  to_handle: bob
                  amount: 100
                - from_handle: bob
                  to_handle: cy
                  amount: 50
      responses:
        '201':
          description: Settlement created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
              example:
                settlement_id: st_1
                committed_at: '2026-09-24T11:12:00+00:00'
                payments:
                  - payment_id: p_9
                    from_user_id: u_1
                    from_handle: ada
                    to_user_id: u_2
                    to_handle: bob
                    amount: 100
                    currency: EUR
                    note: ''
                    visibility: public
                    request_id: null
                    created_at: '2026-09-24T11:12:00+00:00'
                    settlement_id: st_1
        '200':
          description: Idempotent replay - same key and body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '400':
          description: Missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: missing_idempotency_key
                  message: Idempotency-Key header is required
        '403':
          description: Not a settlement operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: forbidden
                  message: Not a settlement operator
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: User not found
        '409':
          description: Insufficient collective funds or idempotency key reuse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficient_funds:
                  summary: Insufficient collective funds
                  value:
                    error:
                      code: insufficient_funds
                      message: Insufficient collective funds
                idempotency_key_reuse:
                  summary: Idempotency key reuse with different body
                  value:
                    error:
                      code: idempotency_key_reuse
                      message: Idempotency key already used with different request body
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                self_payment:
                  summary: Cannot transfer to yourself
                  value:
                    error:
                      code: self_payment
                      message: Cannot transfer to yourself
                invalid_transfers:
                  summary: Invalid transfers
                  value:
                    error:
                      code: validation_failed
                      message: transfers must have 1..32 entries
      security:
        - BearerAuth: []

  /_test/reset:
    post:
      tags: [Test]
      summary: Reset and seed service state
      description: |
        Replace all service state with the fixture in the request body. When reset returns
        204, subsequent requests must see only that fixture. Repeated resets are supported.
        This test endpoint must be enabled in the delivered image and requires no authentication.
      operationId: reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixtureResetRequest'
            example:
              currency: EUR
              minor_units: 2
              users:
                - id: u_ada
                  email: ada@example.com
                  password: correct horse
                  display_name: Ada
                  handle: ada
                  balance: 10000
                - id: u_bob
                  email: bob@example.com
                  password: correct horse
                  display_name: Bob
                  handle: bob
                  balance: 2500
              payments:
                - id: p_1
                  from_user_id: u_ada
                  to_user_id: u_bob
                  amount: 500
                  note: coffee
                  visibility: public
              requests:
                - id: rq_1
                  requester_id: u_bob
                  payer_id: u_ada
                  amount: 1200
                  note: taxi
                  status: pending
              settlement_operator_ids: [u_ada]
      responses:
        '204':
          description: State reset successfully
        '422':
          description: Invalid fixture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: validation_failed
                  message: Unknown currency: USD

  /_test/export:
    get:
      tags: [Test]
      summary: Export service state
      description: |
        Returns the current service state as a JSON object. May contain credentials and session
        tokens. This is a read-only snapshot; subsequent source writes do not change it.
      operationId: exportState
      responses:
        '200':
          description: State exported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
              example:
                track: pocketful
                format_version: 1
                state:
                  currency: EUR
                  minor_units: 2
                  users:
                    - id: u_ada
                      email: ada@example.com
                      password: $2b$12$...
                      display_name: Ada
                      handle: ada
                      balance: 10000
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  payments: []
                  requests: []
                  settlement_operator_ids: [u_ada]

  /_test/import:
    post:
      tags: [Test]
      summary: Import service state
      description: |
        Atomically replaces the service's state with the provided state. Import is replacement,
        not merge; repeating it restores the exported state without duplicating anything.
        Invalid JSON follows §5; missing fields, wrong track/version or an invalid state give
        422 `validation_failed` without changing the destination.
      operationId: importState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
            example:
              track: pocketful
              format_version: 1
              state:
                currency: EUR
                minor_units: 2
                users:
                  - id: u_ada
                    email: ada@example.com
                    password: $2b$12$...
                    display_name: Ada
                    handle: ada
                    balance: 10000
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                payments: []
                requests: []
                settlement_operator_ids: [u_ada]
      responses:
        '204':
          description: State imported successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from `/auth/login`

  schemas:
    # Health
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    # Auth
    SignupRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          pattern: '^[^@]+@[^@]+\.[^@]+$'
          example: ada@example.com
        password:
          type: string
          minLength: 8
          example: correct horse
        display_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Ada

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          pattern: '^[^@]+@[^@]+\.[^@]+$'
          example: ada@example.com
        password:
          type: string
          example: correct horse

    TokenResponse:
      type: object
      required: [user_id, display_name, token]
      properties:
        user_id:
          type: string
          example: u_1
        display_name:
          type: string
          example: Ada
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # User
    MeResponse:
      type: object
      required: [user_id, display_name, handle, balance, currency, minor_units]
      properties:
        user_id:
          type: string
          example: u_1
        display_name:
          type: string
          example: Ada
        handle:
          type: string
          pattern: '^[a-z0-9_]{1,20}$'
          example: ada
        balance:
          type: integer
          minimum: 0
          example: 10000
        currency:
          type: string
          enum: [EUR, JPY, BHD]
          example: EUR
        minor_units:
          type: integer
          enum: [0, 2, 3]
          example: 2

    # Payments
    PaymentRequest:
      type: object
      required: [to_handle, amount]
      properties:
        to_handle:
          type: string
          pattern: '^[a-z0-9_]{1,20}$'
          example: bob
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 1500
        note:
          type: string
          maxLength: 200
          example: dinner
        visibility:
          type: string
          enum: [public, private]
          default: public
          example: public

    PaymentResponse:
      type: object
      required: [payment_id, from_user_id, from_handle, to_user_id, to_handle, amount, currency, note, visibility, created_at]
      properties:
        payment_id:
          type: string
          example: p_7
        from_user_id:
          type: string
          example: u_1
        from_handle:
          type: string
          example: ada
        to_user_id:
          type: string
          example: u_2
        to_handle:
          type: string
          example: bob
        amount:
          type: integer
          example: 1500
        currency:
          type: string
          example: EUR
        note:
          type: string
          example: dinner
        visibility:
          type: string
          enum: [public, private]
          example: public
        request_id:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-09-24T11:04:03+00:00'

    # Requests
    RequestCreate:
      type: object
      required: [payer_handle, amount]
      properties:
        payer_handle:
          type: string
          pattern: '^[a-z0-9_]{1,20}$'
          example: ada
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 1200
        note:
          type: string
          maxLength: 200
          example: taxi

    RequestPay:
      type: object
      properties:
        visibility:
          type: string
          enum: [public, private]
          default: public
          example: public

    RequestResponse:
      type: object
      required: [request_id, requester_id, requester_handle, payer_id, payer_handle, amount, currency, note, status, created_at]
      properties:
        request_id:
          type: string
          example: rq_4
        requester_id:
          type: string
          example: u_2
        requester_handle:
          type: string
          example: bob
        payer_id:
          type: string
          example: u_1
        payer_handle:
          type: string
          example: ada
        amount:
          type: integer
          example: 1200
        currency:
          type: string
          example: EUR
        note:
          type: string
          example: taxi
        status:
          type: string
          enum: [pending, paid, declined, cancelled]
          example: pending
        payment_id:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-09-24T11:06:10+00:00'

    RequestListResponse:
      type: object
      required: [requests, has_more]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RequestResponse'
        has_more:
          type: boolean
          example: false

    RequestListParams:
      type: object
      properties:
        direction:
          type: string
          enum: [incoming, outgoing]
          nullable: true
        status:
          type: string
          enum: [pending, paid, declined, cancelled]
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        offset:
          type: integer
          minimum: 0
          default: 0

    # Activity
    ActivityResponse:
      type: object
      required: [payments, has_more]
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponse'
        has_more:
          type: boolean
          example: false

    ActivityParams:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        offset:
          type: integer
          minimum: 0
          default: 0

    # Splits
    SplitRequest:
      type: object
      required: [amount, participant_handles]
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 3000
        participant_handles:
          type: array
          items:
            type: string
            pattern: '^[a-z0-9_]{1,20}$'
          minItems: 1
          example: [ada, bob, cy]
        note:
          type: string
          maxLength: 200
          example: dinner

    SplitShare:
      type: object
      required: [handle, amount]
      properties:
        handle:
          type: string
          pattern: '^[a-z0-9_]{1,20}$'
          example: ada
        amount:
          type: integer
          example: 1000

    SplitResponse:
      type: object
      required: [split_id, amount, currency, note, shares, requests, created_at]
      properties:
        split_id:
          type: string
          example: sp_2
        amount:
          type: integer
          example: 3000
        currency:
          type: string
          example: EUR
        note:
          type: string
          example: dinner
        shares:
          type: array
          items:
            $ref: '#/components/schemas/SplitShare'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RequestResponse'
        created_at:
          type: string
          format: date-time
          example: '2026-09-24T11:11:00+00:00'

    # Settlements
    SettlementTransfer:
      type: object
      required: [from_handle, to_handle, amount]
      properties:
        from_handle:
          type: string
          pattern: '^[a-z0-9_]{1,20}$'
          example: ada
        to_handle:
          type: string
          pattern: '^[a-z0-9_]{1,20}$'
          example: bob
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 100
        note:
          type: string
          maxLength: 200
          default: ''
        visibility:
          type: string
          enum: [public, private]
          default: public

    SettlementRequest:
      type: object
      required: [transfers]
      properties:
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/SettlementTransfer'
          minItems: 1
          maxItems: 32

    SettlementPaymentResponse:
      type: object
      required: [payment_id, from_user_id, from_handle, to_user_id, to_handle, amount, currency, note, visibility, created_at, settlement_id]
      properties:
        payment_id:
          type: string
          example: p_9
        from_user_id:
          type: string
          example: u_1
        from_handle:
          type: string
          example: ada
        to_user_id:
          type: string
          example: u_2
        to_handle:
          type: string
          example: bob
        amount:
          type: integer
          example: 100
        currency:
          type: string
          example: EUR
        note:
          type: string
          example: ''
        visibility:
          type: string
          enum: [public, private]
          example: public
        request_id:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-09-24T11:12:00+00:00'
        settlement_id:
          type: string
          example: st_1

    SettlementResponse:
      type: object
      required: [settlement_id, committed_at, payments]
      properties:
        settlement_id:
          type: string
          example: st_1
        committed_at:
          type: string
          format: date-time
          example: '2026-09-24T11:12:00+00:00'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/SettlementPaymentResponse'

    # Test
    FixtureUser:
      type: object
      required: [id, email, password, display_name, handle, balance]
      properties:
        id:
          type: string
          example: u_ada
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          example: correct horse
        display_name:
          type: string
          example: Ada
        handle:
          type: string
          pattern: '^[a-z0-9_]{1,20}$'
          example: ada
        balance:
          type: integer
          minimum: 0
          example: 10000

    FixturePayment:
      type: object
      required: [id, from_user_id, to_user_id, amount]
      properties:
        id:
          type: string
          example: p_1
        from_user_id:
          type: string
          example: u_ada
        to_user_id:
          type: string
          example: u_bob
        amount:
          type: integer
          example: 500
        note:
          type: string
          maxLength: 200
          example: coffee
        visibility:
          type: string
          enum: [public, private]
          default: public

    FixtureRequest:
      type: object
      required: [id, requester_id, payer_id, amount, status]
      properties:
        id:
          type: string
          example: rq_1
        requester_id:
          type: string
          example: u_bob
        payer_id:
          type: string
          example: u_ada
        amount:
          type: integer
          example: 1200
        note:
          type: string
          maxLength: 200
          example: taxi
        status:
          type: string
          enum: [pending, paid, declined, cancelled]
          default: pending

    FixtureResetRequest:
      type: object
      required: [currency, minor_units, users]
      properties:
        currency:
          type: string
          enum: [EUR, JPY, BHD]
          example: EUR
        minor_units:
          type: integer
          enum: [0, 2, 3]
          example: 2
        users:
          type: array
          items:
            $ref: '#/components/schemas/FixtureUser'
          minItems: 1
        payments:
          type: array
          items:
            $ref: '#/components/schemas/FixturePayment'
          default: []
        requests:
          type: array
          items:
            $ref: '#/components/schemas/FixtureRequest'
          default: []
        settlement_operator_ids:
          type: array
          items:
            type: string
          default: []

    ExportResponse:
      type: object
      required: [track, format_version, state]
      properties:
        track:
          type: string
          enum: [pocketful]
          example: pocketful
        format_version:
          type: integer
          enum: [1]
          example: 1
        state:
          type: object
          example:
            currency: EUR
            minor_units: 2
            users: []
            payments: []
            requests: []
            settlement_operator_ids: []

    ImportRequest:
      type: object
      required: [track, format_version, state]
      properties:
        track:
          type: string
          enum: [pocketful]
          example: pocketful
        format_version:
          type: integer
          enum: [1]
          example: 1
        state:
          type: object
          example:
            currency: EUR
            minor_units: 2
            users: []
            payments: []
            requests: []
            settlement_operator_ids: []

    # Error
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: insufficient_funds
            message:
              type: string
              example: Insufficient funds
