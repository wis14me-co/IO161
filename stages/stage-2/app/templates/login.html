{% extends "base.html" %}

{% block title %}Login - Pocketful{% endblock %}

{% block content %}
<div class="auth-container" data-testid="login-container">
    <div class="auth-card">
        <h2 data-testid="login-title">Login</h2>
        
        {% if error %}
        <div class="alert alert-error" data-testid="login-error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/auth/login" class="auth-form" data-testid="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="form-group">
                <label for="email" data-testid="login-email-label">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" data-testid="login-email-input">
            </div>
            
            <div class="form-group">
                <label for="password" data-testid="login-password-label">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" data-testid="login-password-input">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" data-testid="login-submit">Login</button>
        </form>
        
        <p class="auth-switch" data-testid="login-switch">
            Don't have an account? <a href="/signup">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
