{% extends "base.html" %}

{% block title %}Sign Up - Pocketful{% endblock %}

{% block content %}
<div class="auth-container" data-testid="signup-container">
    <div class="auth-card">
        <h2 data-testid="signup-title">Create Account</h2>
        
        {% if error %}
        <div class="alert alert-error" data-testid="signup-error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/auth/signup" class="auth-form" data-testid="signup-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="form-group">
                <label for="email" data-testid="signup-email-label">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" data-testid="signup-email-input">
            </div>
            
            <div class="form-group">
                <label for="password" data-testid="signup-password-label">Password</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" data-testid="signup-password-input">
                <small class="form-hint">At least 8 characters</small>
            </div>
            
            <div class="form-group">
                <label for="display_name" data-testid="signup-display-name-label">Display Name</label>
                <input type="text" id="display_name" name="display_name" required maxlength="100" autocomplete="name" data-testid="signup-display-name-input">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" data-testid="signup-submit">Create Account</button>
        </form>
        
        <p class="auth-switch" data-testid="signup-switch">
            Already have an account? <a href="/login">Login</a>
        </p>
    </div>
</div>
{% endblock %}
