<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pocketful{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_head %}{% endblock %}
    <script>
        // CSRF token for forms
        window.csrfToken = "{{ csrf_token }}";
    </script>
</head>
<body>
    <header class="header" data-testid="header">
        <div class="container">
            <h1 class="logo"><a href="/">Pocketful</a></h1>
            <nav class="nav" data-testid="nav">
                {% if user %}
                    <span class="user-info" data-testid="user-info">
                        {{ user.display_name }} ({{ user.handle }})
                    </span>
                    <a href="/requests" data-testid="nav-requests">Requests</a>
                    <a href="/authorizations" data-testid="nav-authorizations">Authorizations</a>
                    <a href="/split" data-testid="nav-split">Split</a>
                    <a href="/activity" data-testid="nav-activity">Activity</a>
                    <form action="/auth/logout" method="POST" class="inline-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button type="submit" class="btn btn-secondary" data-testid="logout-btn">Logout</button>
                    </form>
                {% else %}
                    <a href="/login" data-testid="nav-login">Login</a>
                    <a href="/signup" data-testid="nav-signup">Sign Up</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="main" data-testid="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="footer" data-testid="footer">
        <div class="container">
            <p>&copy; 2024 Pocketful. All rights reserved.</p>
        </div>
    </footer>
    <script src="/static/js/main.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
